name: scan
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node .github/workflows/scan.mjs
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
